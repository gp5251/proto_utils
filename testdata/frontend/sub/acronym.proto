syntax = "proto3";

package c;

// 缩写方法名 fixture:验证 resolveMethod 的防护(grpc-js stub 用
// lodash.camelCase → listFbVariableRequest,朴素首字母小写会失配)。
message ListFBVariableRequest {
  string fb_name = 1;
}

message ListFBVariableResponse {
  repeated string names = 1;
}

service Acronym {
  rpc ListFBVariableRequest (ListFBVariableRequest) returns (ListFBVariableResponse);
  // 0.3.78 / ADR-0013:client stream 会话 fixture;callUnary 撞上仍应返回明确错误
  rpc UploadFBData (stream ListFBVariableRequest) returns (ListFBVariableResponse);
  // 定速服务端流:供 cancel 停流测试;自然情况下不主动 end
  rpc WatchFBVariable (ListFBVariableRequest) returns (stream ListFBVariableResponse);
}
